name: Build Buddy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python -m pip install Pillow
      - name: Generate sprites
        run: python tools/generate_pets.py
      - name: Check sprite layout and decode
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in Path("generated/pets").glob("*.png"):
              with Image.open(path) as im:
                  assert im.size == (1344, 384), (path, im.size)
                  assert im.mode == "RGBA", (path, im.mode)
                  im.verify()
          assert {p.name for p in Path("generated/pets").glob("*.png")} == {"snowman.png"}
          PY
      - name: Check host logic
        run: |
          cc -O2 -fno-math-errno -DHOST fidget.c -o /tmp/q2-pet-check
          /tmp/q2-pet-check check
      - name: Build Q2 binary and package
        run: ./build.sh
      - name: Upload installable app
        uses: actions/upload-artifact@v4
        with:
          name: buddy
          path: dist/fidget.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fidget.zip

      - name: Publish v1.0.0 from release commit
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'release: v1.0.0')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Q2 Pet v1.0.0 — Four Seasons
          target_commitish: ${{ github.sha }}
          body: |
            First four-season Q2 Pet release, based on DiamondBond's original Buddy.

            - Spring: Blossom
            - Summer: Beach Ball with sunglasses
            - Autumn: original Ghost
            - Winter: Snowman
            - Automatic season selection or manual character choice
            - Blue/Pink recolouring for all seasonal buddies
            - 14-expression sprite sheets, Tamagotchi and original wheel/touch controls
            - Removed older fantasy and discontinued characters and hemisphere setting

            Download `fidget.zip` and install the .fidget app directory on the Shanling Q2.
            Device-level testing is still recommended.
          files: dist/fidget.zip
