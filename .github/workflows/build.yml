name: Build Buddy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python -m pip install Pillow
      - name: Generate and validate Tom sprite
        run: |
          python tools/generate_tom.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path("generated/pets/tom.png")
          with Image.open(path) as image:
              assert image.size == (1344, 384)
              assert image.mode == "RGBA"
              image.verify()
          with Image.open(path) as image:
              assert image.getbbox() is not None
          PY
      - name: Check host logic
        run: |
          cc -O2 -fno-math-errno -DHOST fidget.c -o /tmp/q2-pet-check
          /tmp/q2-pet-check check
      - name: Export procedural Kasper and Frosty previews
        run: |
          python tools/export_previews.py
          python - <<'PY'
          from PIL import Image
          for name in ("kasper", "frosty"):
              for suffix in ("template", "guide"):
                  path = f"generated/previews/{name}-{suffix}.png"
                  with Image.open(path) as image:
                      assert image.size == (1344, 384), path
                      image.verify()
          PY
      - name: Upload character previews
        uses: actions/upload-artifact@v4
        with:
          name: buddy-character-previews
          path: generated/previews/*.png
      - name: Build Q2 binary and package
        run: ./build.sh
      - name: Check Tom is bundled
        run: unzip -l dist/fidget.zip | grep -q '.fidget/pets/tom.png'
      - name: Upload installable app
        uses: actions/upload-artifact@v4
        with:
          name: buddy
          path: dist/fidget.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fidget.zip

      - name: Publish v1.2.0 from release commit
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'release: v1.2.0')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Buddy v1.2.0 — Kasper, Frosty and Tom
          target_commitish: ${{ github.sha }}
          body: |
            Buddy v1.2.0 for Shanling Q2, based on DiamondBond's q2-fidget.

            - Kasper: original procedurally shaded ghost
            - Frosty: procedural snowman with updated curved Santa hat brim,
              no fixed carrot nose and no scarf
            - Tom: built-in white cat with 14 expressive sprite frames;
              cleaned transparent background
            - Auto (Frosty in winter, Kasper otherwise), plus Custom buddy.png
            - Tamagotchi, touch, wheel, themes and persisted pet selection
            - Kasper and Frosty preview sheets exported from the actual C
              renderer for inspection (not installed on Q2)

            Download fidget.zip to install the .fidget directory on your Q2.
            Preview images are supplied for visual inspection.
            Physical device verification is still recommended.
          files: |
            dist/fidget.zip
            generated/previews/*.png
